<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url('background.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Bitcount Prop Double', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #faf7f0;
      border-radius: 24px;
      padding: 2.5rem 3rem;
      max-width: 520px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      font-size: 2.6rem;
      margin: 0 0 1rem;
      color: #000000;
      font-weight: 700;
    }

    p {
      font-size: 1.2rem;
      margin: 0.4rem 0;
      color: #000000;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hello World!</h1>
    <p>Welcome to Web Engineering Lab 1</p>
    <p>We are applying the WYSIWYG principle.</p>
  </div>

</body>
</html>
